<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildflower App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f0; min-height: 100vh; }
    header { background: white; padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 18px; color: #2d5a27; }
    .back { cursor: pointer; color: #2d5a27; font-size: 14px; margin-right: 8px; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .card .number { font-size: 36px; font-weight: 700; color: #2d5a27; }
    .card .subtitle { font-size: 13px; color: #aaa; margin-top: 4px; }
    .locatii-list { list-style: none; }
    .locatii-list li { padding: 12px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 15px; cursor: pointer; }
    .locatii-list li:hover { background: #f9f9f7; }
    .locatii-list li:last-child { border-bottom: none; }
    .badge { background: #e8f5e9; color: #2d5a27; padding: 3px 10px; border-radius: 20px; font-size: 12px; }
    .detail-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #888; font-size: 12px; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { color: #222; }
    #detail-view { display: none; }
    #dashboard-view { display: block; }
  </style>
</head>
<body>
  <header>
    <span id="back-btn" class="back" onclick="showDashboard()" style="display:none">← Înapoi</span>
    <span>🌸</span>
    <h1 id="header-title">Wildflower App</h1>
  </header>

  <div id="dashboard-view" class="container">
    <div class="card">
      <h2>Locații active</h2>
      <div class="number" id="nr-locatii">...</div>
      <div class="subtitle">locații în gestiune</div>
    </div>
    <div class="card">
      <h2>Locații</h2>
      <ul class="locatii-list" id="lista-locatii">
        <li style="color:#aaa;font-size:14px">Se încarcă...</li>
      </ul>
    </div>
  </div>

  <div id="detail-view" class="container">
    <div class="card">
      <h2>Detalii locație</h2>
      <div id="detail-content"></div>
    </div>
    <div class="card" id="plante-card" style="display:none">
      <h2>Plante</h2>
      <div id="plante-content"></div>
    </div>
  </div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRptU49euOwAQU38YSG92XQFbhbPRImhp_X_OmedfxHSHP7rX3Xv_4WbtLRym-MeA96E1dLEA8fzKoM/pub?output=csv&gid=1134673396";
    const PLANTE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRptU49euOwAQU38YSG92XQFbhbPRImhp_X_OmedfxHSHP7rX3Xv_4WbtLRym-MeA96E1dLEA8fzKoM/pub?output=csv&gid=1673932267";
    const VIZITE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbrklorijnFRuGCPRMZV8aIuas2cSRJX7L03uTXyGFeDJGXZmCZXY9Ivdk3lV4iBtps8fmflSxhoBg/pub?output=csv&gid=109752688";

    let allLocatii = [];

    function parseCSV(text) {
      const lines = text.trim().split("\n");
      const headers = lines[0].split(",").map(h => h.trim().replace(/"/g, ""));
      return lines.slice(1).map(line => {
        const vals = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') {
            inQuotes = !inQuotes;
          } else if (line[i] === ',' && !inQuotes) {
            vals.push(current.trim());
            current = "";
          } else {
            current += line[i];
          }
        }
        vals.push(current.trim());
        const obj = {};
        headers.forEach((h, i) => obj[h] = vals[i] || "");
        return obj;
      });
    }

    function showDashboard() {
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("dashboard-view").style.display = "block";
      document.getElementById("back-btn").style.display = "none";
      document.getElementById("header-title").textContent = "Wildflower App";
    }

    function showDetail(loc) {
      document.getElementById("dashboard-view").style.display = "none";
      document.getElementById("detail-view").style.display = "block";
      document.getElementById("back-btn").style.display = "inline";
      document.getElementById("header-title").textContent = loc["Nume client final"] || "Locație";
      document.getElementById("plante-card").style.display = "none";

      const fields = [
        ["Tehnician", "ID_Tehnician"],
        ["Firma Facility", "Firma Facility Management"],
        ["Adresă", "Adresa"],
        ["Email", "email"],
        ["Status", "Status"]
      ];

      let html = "";
      fields.forEach(([label, key]) => {
        if (loc[key]) {
          html += `<div class="detail-row">
            <div class="detail-label">${label}</div>
            <div class="detail-value">${loc[key]}</div>
          </div>`;
        }
      });
      document.getElementById("detail-content").innerHTML = html;

      const numeLocatie = loc["Nume client final"];
      fetch(PLANTE_URL)
        .then(r => r.text())
        .then(text => {
          const plante = parseCSV(text).filter(p => p["ID_Locatie"] === numeLocatie);
          if (plante.length > 0) {
            document.getElementById("plante-card").style.display = "block";
            let planteHtml = "";
            plante.forEach(p => {
              planteHtml += `<div class="detail-row">
                <div class="detail-value">🌿 ${p["Specie planta"]} × ${p["Numar bucati"]}</div>
                ${p["Observatii"] ? `<div style="font-size:12px;color:#aaa;margin-top:2px">${p["Observatii"]}</div>` : ""}
              </div>`;
            });
            document.getElementById("plante-content").innerHTML = planteHtml;
          }
        });
    }

    fetch(SHEET_URL)
      .then(r => r.text())
      .then(text => {
        const rows = parseCSV(text);
        allLocatii = rows.filter(r => r["Status"] === "activ" || r["Status"] === "");
        document.getElementById("nr-locatii").textContent = allLocatii.length;
        const lista = document.getElementById("lista-locatii");
        lista.innerHTML = "";
        allLocatii.forEach(loc => {
          const li = document.createElement("li");
          li.innerHTML = `<span>${loc["Nume client final"] || "—"}</span><span class="badge">${loc["ID_Tehnician"] || "—"}</span>`;
          li.onclick = () => showDetail(loc);
          lista.appendChild(li);
        });
      });
  </script>
</body>
</html>
